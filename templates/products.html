{% extends "base.html" %}
{% block title %}Продукти · Techtrix ERP{% endblock %}
{% block content %}
    
<h1>Продукти</h1>
    
<table>
        
<tr>
            
<th>Код</th>
            
<th>Име</th>
            
<th>Наличност</th>
            
<th>Продажна цена (€)</th>
        
</tr>
        
{% for p in products %}
        
<tr>
            
<td><a href="{{ url_for('product_detail', product_id=p.id) }}">{{ p.code }}</a></td>
            
<td>{{ p.name }}</td>
            
<td>{{ p.quantity }}</td>
            
<td>{{ "%.2f"|format(p.sale_price) }}</td>
        
</tr>
        
{% endfor %}
    
</table>
{% endblock %}
