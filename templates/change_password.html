{% extends "base.html" %}
{% block title %}Смяна на парола · Techtrix ERP{% endblock %}
{% block content %}
    
<h1>Смяна на парола</h1>
    
{% if error %}
        
<p class="error">{{ error }}</p>
    
{% endif %}
    
{% if message %}
        
<p class="success">{{ message }}</p>
    
{% endif %}
    
<form method="post">
        
<p>Стара парола: <input type="password" name="old_password" required></p>
        
<p>Нова парола: <input type="password" name="new_password" minlength="6" required></p>
        
<p>Повтори новата: <input type="password" name="new_password2" minlength="6" required></p>
        
<button type="submit">Смени паролата</button>
    
</form>
{% endblock %}
